<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FinFlow — учёт личных доходов и расходов: категории, бюджеты, графики, экспорт в CSV. Работает без интернета.">
  <meta name="theme-color" content="#1f4e8c">
  <title>FinFlow — учёт личных финансов</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="page">

    <!-- Шапка -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="12" stroke-width="5" stroke-dasharray="48 28" />
        </svg>
        <span class="brand__name">FinFlow</span>
      </div>

      <nav class="month" aria-label="Месяц">
        <button class="icon-btn" id="prev-month" type="button" data-testid="prev-month" data-i18n-aria="prevMonth">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <h1 class="month__label" id="month-label" data-testid="month-label" aria-live="polite"></h1>
        <button class="icon-btn" id="next-month" type="button" data-testid="next-month" data-i18n-aria="nextMonth">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
        </button>
      </nav>

      <div class="topbar__tools">
        <button class="text-btn" id="install" type="button" data-testid="install" data-i18n="install" hidden>Установить</button>
        <button class="text-btn" id="lang-toggle" type="button" data-testid="lang-toggle">EN</button>
        <button class="icon-btn" id="theme-toggle" type="button" data-testid="theme-toggle" data-i18n-aria="toggleTheme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        </button>
      </div>
    </header>

    <main class="layout">

      <!-- Кольцо расходов -->
      <section class="panel ring-panel" aria-labelledby="ring-title">
        <h2 class="panel__title" id="ring-title" data-i18n="spendingTitle">Куда ушли деньги</h2>
        <div class="ring" data-testid="ring">
          <svg class="ring__svg" id="ring-svg" viewBox="0 0 200 200" role="img" data-i18n-aria="ringLabel"></svg>
          <div class="ring__center">
            <span class="ring__caption" id="ring-caption" data-testid="ring-caption"></span>
            <span class="ring__value" id="ring-value" data-testid="ring-value"></span>
          </div>
        </div>
        <ul class="legend" id="legend" data-testid="legend"></ul>
        <p class="ring-empty" data-testid="ring-empty" data-i18n="ringEmpty">В этом месяце расходов пока нет</p>
      </section>

      <div class="side">
        <!-- Итоги месяца -->
        <section class="totals" aria-label="Итоги месяца">
          <div class="total">
            <span class="total__label" data-i18n="income">Доходы</span>
            <span class="total__value total__value--income" id="total-income" data-testid="total-income"></span>
          </div>
          <div class="total">
            <span class="total__label" data-i18n="expenses">Расходы</span>
            <span class="total__value total__value--expense" id="total-expense" data-testid="total-expense"></span>
            <span class="total__hint" id="expense-trend" data-testid="expense-trend"></span>
          </div>
          <div class="total">
            <span class="total__label" data-i18n="balance">Остаток</span>
            <span class="total__value" id="total-balance" data-testid="total-balance"></span>
          </div>
        </section>

        <!-- Форма: новая операция или редактирование -->
        <section class="panel form-panel" id="form-panel" aria-labelledby="form-title">
          <h2 class="panel__title" id="form-title" data-testid="form-title" data-i18n="formTitle">Новая операция</h2>

          <form class="form" id="tx-form" data-testid="tx-form" novalidate>
            <div class="segmented" role="radiogroup" data-i18n-aria="typeLabel">
              <label class="segmented__item" data-testid="type-expense">
                <input type="radio" name="type" value="expense" checked>
                <span data-i18n="expense">Расход</span>
              </label>
              <label class="segmented__item" data-testid="type-income">
                <input type="radio" name="type" value="income">
                <span data-i18n="incomeOne">Доход</span>
              </label>
            </div>

            <div class="form__grid">
              <label class="field">
                <span class="field__label" data-i18n="amount">Сумма, ₸</span>
                <input class="field__input" id="amount" type="text" inputmode="decimal" autocomplete="off" data-testid="amount" placeholder="0">
              </label>
              <label class="field">
                <span class="field__label" data-i18n="category">Категория</span>
                <select class="field__input" id="category" data-testid="category"></select>
              </label>
              <label class="field">
                <span class="field__label" data-i18n="date">Дата</span>
                <input class="field__input" id="date" type="date" data-testid="date">
              </label>
              <label class="field">
                <span class="field__label" data-i18n="note">Комментарий</span>
                <input class="field__input" id="note" type="text" maxlength="80" autocomplete="off" data-testid="note" data-i18n-placeholder="notePlaceholder">
              </label>
            </div>

            <p class="form__error" id="form-error" role="alert" data-testid="form-error"></p>
            <div class="form__actions">
              <button class="btn btn--primary" id="submit" type="submit" data-testid="submit">Добавить</button>
              <button class="btn btn--ghost" id="cancel-edit" type="button" data-testid="cancel-edit" data-i18n="cancel" hidden>Отмена</button>
            </div>
          </form>
        </section>
      </div>

      <!-- Бюджеты -->
      <section class="panel budgets-panel" aria-labelledby="budgets-title">
        <div class="panel__head">
          <h2 class="panel__title" id="budgets-title" data-i18n="budgetsTitle">Бюджеты на месяц</h2>
          <button class="text-btn" id="budgets-toggle" type="button" data-testid="budgets-toggle" data-i18n="budgetsEdit">Настроить</button>
        </div>
        <div id="budgets" data-testid="budgets"></div>
        <form class="budget-form" id="budget-form" data-testid="budget-form" hidden novalidate></form>
        <p class="form__error" id="budget-error" role="alert" data-testid="budget-error"></p>
      </section>

      <!-- График за 6 месяцев -->
      <section class="panel chart-panel" aria-labelledby="chart-title">
        <div class="panel__head">
          <h2 class="panel__title" id="chart-title" data-i18n="chartTitle">Последние 6 месяцев</h2>
          <div class="chart-legend" aria-hidden="true">
            <span><i class="swatch swatch--income"></i><span data-i18n="income">Доходы</span></span>
            <span><i class="swatch swatch--expense"></i><span data-i18n="expenses">Расходы</span></span>
          </div>
        </div>
        <svg class="chart" id="chart" data-testid="chart" role="img" data-i18n-aria="chartLabel"></svg>
        <p class="chart-hint" data-i18n="chartHint">Нажмите на месяц, чтобы открыть его</p>
      </section>

      <!-- Список операций -->
      <section class="panel list-panel" aria-labelledby="list-title">
        <div class="list-head">
          <h2 class="panel__title" id="list-title" data-i18n="listTitle">Операции</h2>
          <div class="list-tools">
            <div class="chips" id="type-filter" role="group" data-i18n-aria="filterLabel">
              <button class="chip is-active" type="button" data-type="all" data-testid="filter-all" data-i18n="all">Все</button>
              <button class="chip" type="button" data-type="expense" data-testid="filter-expense" data-i18n="expensesShort">Расходы</button>
              <button class="chip" type="button" data-type="income" data-testid="filter-income" data-i18n="incomeShort">Доходы</button>
            </div>
            <input class="search" id="search" type="search" data-testid="search" data-i18n-placeholder="search">
            <button class="btn btn--ghost" id="export" type="button" data-testid="export-csv" data-i18n="export">Скачать CSV</button>
            <label class="btn btn--ghost file-btn" data-testid="import-label">
              <span data-i18n="import">Загрузить CSV</span>
              <input type="file" id="import" accept=".csv,text/csv" data-testid="import-csv">
            </label>
          </div>
        </div>

        <p class="active-category" id="active-category" data-testid="active-category" hidden>
          <span id="active-category-text"></span>
          <button class="text-btn" id="clear-category" type="button" data-testid="clear-category" data-i18n="showAll">Показать все</button>
        </p>

        <div id="tx-list" data-testid="tx-list"></div>

        <div class="empty" id="empty" data-testid="empty-state">
          <p id="empty-text"></p>
          <button class="btn btn--ghost" id="load-demo" type="button" data-testid="load-demo" data-i18n="loadDemo">Заполнить примером</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Уведомление -->
  <div class="toast" id="toast" role="status" data-testid="toast">
    <span id="toast-text" data-testid="toast-text"></span>
    <button class="toast__action" id="toast-undo" type="button" data-testid="toast-undo" data-i18n="undo" hidden>Вернуть</button>
  </div>
</body>
</html>
